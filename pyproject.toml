[project]
name = "quarq"
version = "0.0.2"
description = "French institutional portfolio analytics with RAG and local LLM"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "zkmarc"}
]
keywords = ["finance", "portfolio", "rag", "llm", "analytics", "french", "institutional"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/yodablocks"
Repository = "https://github.com/yodablocks/quarq"

[tool.hatch.build.targets.wheel]
packages = ["quarq"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
