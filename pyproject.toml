[project]
name = "quarq"
version = "0.0.3"
description = "French institutional portfolio analytics with RAG and local LLM"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "zkmarc"}
]
keywords = ["finance", "portfolio", "rag", "llm", "analytics", "french", "institutional"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pyfiglet>=1.0.2",
    "textual>=0.80.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
    "yfinance>=0.2.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "plotly>=6.0.0",
    "jinja2>=3.1.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pdfplumber>=0.11.0",
    "playwright>=1.44.0",
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "responses>=0.25.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.9.0",
]

[project.scripts]
quarq = "quarq.cli:main"

[project.urls]
Homepage = "https://github.com/yodablocks"
Repository = "https://github.com/yodablocks/quarq"

[tool.hatch.build.targets.wheel]
packages = ["quarq"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
