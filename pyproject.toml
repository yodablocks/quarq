[project]
name = "quarq"
version = "0.1.0"
description = "French institutional portfolio analytics with RAG and local LLM"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "zkmarc"}
]
keywords = ["finance", "portfolio", "rag", "llm", "analytics", "french", "institutional"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pyfiglet>=1.0.2",
    "textual>=0.80.0",
    "rich>=15.0.0",
    "fastapi>=0.136.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.9.0",
    "yfinance>=0.2.0",
    "pandas>=2.0.0",
    "numpy>=2.0.0",
    "plotly>=6.6.0",
    "jinja2>=3.1.5",
    "chromadb>=1.0.0",
    "sentence-transformers>=3.0.0",
    "pdfplumber>=0.11.0",
    "playwright>=1.44.0",
    "openai>=2.0.0",
    "anthropic>=0.25.0",
    "requests>=2.31.0",
    "tomli-w>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.27.0",
    "responses>=0.25.0",
    "ruff>=0.15.0",
    "mypy>=1.14.0",
]

[project.scripts]
quarq = "quarq.cli:main"

[project.urls]
Homepage = "https://github.com/yodablocks"
Repository = "https://github.com/yodablocks/quarq"

[tool.hatch.build.targets.wheel]
packages = ["quarq"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["quarq"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
